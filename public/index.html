<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Letterboxd Wrapped</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Letterboxd Wrapped</h1>
      <form id="lookup-form">
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Username"
          required
        />
        <button type="submit">Generate</button>
      </form>
      <p id="status-message" class="status hidden"></p>
    </header>

    <section id="report" class="hidden">
      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="films-watched">0</div>
          <div class="stat-label">Films</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="average-rating">-</div>
          <div class="stat-label">Avg Rating</div>
        </div>
      </div>

      <div class="chart-row">
        <div class="chart-col">
          <h2>Decades</h2>
          <canvas id="decade-chart" height="280"></canvas>
          <div id="decade-detail" class="chart-detail hidden"></div>
        </div>
        <div class="chart-col">
          <h2>Genres</h2>
          <canvas id="genre-chart" height="280"></canvas>
          <div id="genre-detail" class="chart-detail hidden"></div>
        </div>
        <div class="chart-col">
          <h2>Countries</h2>
          <canvas id="country-chart" height="280"></canvas>
          <div id="country-detail" class="chart-detail hidden"></div>
        </div>
      </div>

      <div class="takes-row">
        <div class="takes-col">
          <h2>Underrated</h2>
          <ul id="underrated-list"></ul>
        </div>
        <div class="takes-col">
          <h2>Harshest</h2>
          <ul id="overrated-list"></ul>
        </div>
      </div>

      <div class="section">
        <h2>Directors</h2>
        <table>
          <thead>
            <tr>
              <th>Director</th>
              <th>Films</th>
              <th>Avg</th>
            </tr>
          </thead>
          <tbody id="director-table"></tbody>
        </table>
      </div>

      <div class="footer-actions">
        <button id="share-report" type="button">Copy Share Link</button>
        <button id="share-report-bottom" type="button" class="hidden">Copy Share Link</button>
      </div>
    </section>
  </body>
</html>
